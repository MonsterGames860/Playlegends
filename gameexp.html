<style>
  /* MOD SELECTION MODAL */
  .mod-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 10000;
    justify-content: center;
    align-items: center;
    font-family: 'Arial', sans-serif;
  }
  .mod-modal-overlay.open {
    display: flex;
  }
  .mod-modal {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 2px solid #00d4ff;
    border-radius: 12px;
    padding: 30px;
    max-width: 600px;
    width: 90%;
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
    color: #e6d6ff;
  }
  .mod-modal h2 {
    margin: 0 0 20px 0;
    color: #00d4ff;
    font-size: 20px;
    text-align: center;
  }
  .mod-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .mod-item {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mod-item:hover {
    background: rgba(0, 212, 255, 0.1);
    border-color: #00d4ff;
  }
  .mod-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .mod-item-content {
    flex: 1;
  }
  .mod-item-name {
    font-weight: bold;
    color: #00d4ff;
    margin-bottom: 3px;
  }
  .mod-item-desc {
    font-size: 12px;
    color: #aaa;
  }
  .mod-item-icon {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .mod-modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .mod-modal-actions button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
  }
  .mod-btn-apply {
    background: #00d4ff;
    color: #000;
  }
  .mod-btn-apply:hover {
    background: #00ffff;
  }
  .mod-btn-cancel {
    background: rgba(255,255,255,0.1);
    color: #e6d6ff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .mod-btn-cancel:hover {
    background: rgba(255,255,255,0.15);
  }
  .mod-none-msg {
    text-align: center;
    color: #888;
    padding: 20px;
    font-size: 14px;
  }
</style>

  function getCurrentLang(){
    var stored = localStorage.getItem(STORAGE_KEY);
    if(stored && SUPPORTED.indexOf(stored)!==-1) return stored;
    return DEFAULT_LANG;
  }
  function getLanguageData(lang){
    lang = lang || getCurrentLang();
    return LANG_DATA[lang] || LANG_DATA[DEFAULT_LANG];
  }
  function getLangString(key, lang){
    var data = getLanguageData(lang);
    return (data && data[key]) ? data[key] : key;
  }
  global.LegendsLanguage = {
    getCurrentLang: getCurrentLang,
    getLanguageData: getLanguageData,
    getLangString: getLangString,
    setLanguage: function(lang){
      if(SUPPORTED.indexOf(lang)!==-1){
        localStorage.setItem(STORAGE_KEY, lang);
      }
    },
    getSupportedLanguages: function(){ return SUPPORTED.slice(); }
  };
  global.langData = LANG_DATA;
  global.currentLang = getCurrentLang();
})( typeof window !== 'undefined' ? window : global );

<script>
// LegendsForce Mod System API
window.LF = window.LF || {};

// Mod storage key
const MOD_STORAGE_PREFIX = 'sp_world_mods_';
const SELECTED_MODS_KEY = 'spSelectedMods_';
const WORLD_MODS_LIST_KEY = 'spWorldMods';

/**
 * Parse .lens mod file (JSON format with @lensformat 2 header)
 */
window.LF.parseLensMod = function(lensData) {
  try {
    if (typeof lensData === 'string') {
      const parsed = JSON.parse(lensData);
      return parsed;
    }
    return lensData;
  } catch (e) {
    console.error('Failed to parse .lens mod:', e);
    return null;
  }
};

/**
 * Save mod to localStorage
 */
window.LF.saveMod = function(modData, modId) {
  modId = modId || (modData.namespace + ':' + modData.modName);
  try {
    localStorage.setItem('lf_mod_' + modId, JSON.stringify(modData));
    
    // Update world mods list
    let modsList = [];
    try {
      modsList = JSON.parse(localStorage.getItem(WORLD_MODS_LIST_KEY)) || [];
    } catch (e) {}
    
    if (!modsList.includes(modId)) {
      modsList.push(modId);
      localStorage.setItem(WORLD_MODS_LIST_KEY, JSON.stringify(modsList));
    }
    
    console.log('[LF] Mod saved:', modId);
    return modId;
  } catch (e) {
    console.error('Failed to save mod:', e);
    return null;
  }
};

/**
 * Load mod from localStorage
 */
window.LF.loadMod = function(modId) {
  try {
    const data = localStorage.getItem('lf_mod_' + modId);
    if (data) {
      return JSON.parse(data);
    }
    return null;
  } catch (e) {
    console.error('Failed to load mod:', e);
    return null;
  }
};

/**
 * Get all available mods
 */
window.LF.getAvailableMods = function() {
  let mods = [];
  try {
    const list = JSON.parse(localStorage.getItem(WORLD_MODS_LIST_KEY)) || [];
    list.forEach(modId => {
      const mod = window.LF.loadMod(modId);
      if (mod) {
        mods.push({ id: modId, data: mod });
      }
    });
  } catch (e) {}
  return mods;
};

/**
 * Get mods for a specific world
 */
window.LF.getActiveMods = function(worldId) {
  try {
    const selectedKey = SELECTED_MODS_KEY + worldId;
    const selected = JSON.parse(localStorage.getItem(selectedKey)) || [];
    const mods = [];
    
    selected.forEach(modId => {
      const mod = window.LF.loadMod(modId);
      if (mod) {
        mods.push({ id: modId, data: mod });
      }
    });
    
    return mods;
  } catch (e) {
    console.error('Failed to get active mods:', e);
    return [];
  }
};

/**
 * Set mods for a world
 */
window.LF.setActiveMods = function(worldId, modIds) {
  try {
    const selectedKey = SELECTED_MODS_KEY + worldId;
    localStorage.setItem(selectedKey, JSON.stringify(modIds));
    console.log('[LF] Set active mods for world', worldId, ':', modIds);
  } catch (e) {
    console.error('Failed to set active mods:', e);
  }
};

/**
 * Apply mod entries to game registry
 */
window.LF.applyMod = function(modData, gameState) {
  if (!modData || !modData.entries) return false;
  
  try {
    // Make sure registries exist
    if (!window.__modRegistry) {
      window.__modRegistry = {
        blocks: [],
        items: [],
        entities: []
      };
    }
    
    // Add entries to appropriate registry
    modData.entries.forEach(entry => {
      const item = {
        id: entry.id || (modData.namespace + ':' + entry.displayName),
        name: entry.displayName,
        description: entry.description || '',
        kind: entry.kind || 'block', // block, item, entity
        texture: entry.texture || { mode: 'none' },
        hardness: entry.hardness !== undefined ? entry.hardness : 1.0,
        drop: entry.drop || { mode: 'none' },
        icon: entry.icon || '🟫'
      };
      
      if (entry.kind === 'block') {
        if (!window.__modRegistry.blocks.find(b => b.id === item.id)) {
          window.__modRegistry.blocks.push(item);
        }
      } else if (entry.kind === 'item') {
        if (!window.__modRegistry.items.find(i => i.id === item.id)) {
          window.__modRegistry.items.push(item);
        }
      } else if (entry.kind === 'entity') {
        if (!window.__modRegistry.entities.find(e => e.id === item.id)) {
          window.__modRegistry.entities.push(item);
        }
      }
    });
    
    console.log('[LF] Applied mod:', modData.modName, 'entries:', modData.entries.length);
    return true;
  } catch (e) {
    console.error('Failed to apply mod:', e);
    return false;
  }
};

/**
 * Load and apply mods for a world
 */
window.LF.loadWorldMods = function(worldId, gameState) {
  const activeMods = window.LF.getActiveMods(worldId);
  const results = [];
  
  activeMods.forEach(mod => {
    const success = window.LF.applyMod(mod.data, gameState);
    results.push({
      id: mod.id,
      name: mod.data.modName,
      success: success
    });
  });
  
  console.log('[LF] Loaded mods for world', worldId, ':', results);
  return results;
};

<!-- ========== MOD SELECTION UI ========== -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Create mod modal overlay
  const modalOverlay = document.createElement('div');
  modalOverlay.className = 'mod-modal-overlay';
  modalOverlay.id = 'mod-modal-overlay';
  
  const modal = document.createElement('div');
  modal.className = 'mod-modal';
  modal.innerHTML = `
    <h2>Select Mods for World</h2>
    <div class="mod-list" id="mod-list-container">
      <div class="mod-none-msg">Loading mods...</div>
    </div>
    <div class="mod-modal-actions">
      <button class="mod-btn-apply" id="mod-btn-apply">APPLY</button>
      <button class="mod-btn-cancel" id="mod-btn-cancel">CANCEL</button>
    </div>
  `;
  
  modalOverlay.appendChild(modal);
  document.body.appendChild(modalOverlay);
  
  let currentWorldId = null;
  let selectedModIds = [];
  
  // Render mod list
  function renderModList() {
    const container = document.getElementById('mod-list-container');
    const mods = window.LF.getAvailableMods();
    
    if (mods.length === 0) {
      container.innerHTML = '<div class="mod-none-msg">📦 No mods available. Download from LegendsForce to get started!</div>';
      return;
    }
    
    container.innerHTML = '';
    mods.forEach(mod => {
      const isSelected = selectedModIds.includes(mod.id);
      const modData = mod.data;
      
      const item = document.createElement('div');
      item.className = 'mod-item';
      item.innerHTML = `
        <input type="checkbox" class="mod-checkbox" data-mod-id="${mod.id}" ${isSelected ? 'checked' : ''}>
        <div class="mod-item-icon">${modData.icon || '📦'}</div>
        <div class="mod-item-content">
          <div class="mod-item-name">${modData.modName}</div>
          <div class="mod-item-desc">${modData.description || 'No description'} (${modData.entries ? modData.entries.length : 0} entries)</div>
        </div>
      `;
      
      const checkbox = item.querySelector('input');
      checkbox.addEventListener('change', function(e) {
        if (e.target.checked) {
          if (!selectedModIds.includes(mod.id)) selectedModIds.push(mod.id);
        } else {
          selectedModIds = selectedModIds.filter(id => id !== mod.id);
        }
      });
      
      item.addEventListener('click', function() {
        checkbox.checked = !checkbox.checked;
        if (checkbox.checked) {
          if (!selectedModIds.includes(mod.id)) selectedModIds.push(mod.id);
        } else {
          selectedModIds = selectedModIds.filter(id => id !== mod.id);
        }
      });
      
      container.appendChild(item);
    });
  }
  
  // Open mod selector
  window.openModSelector = function(worldId) {
    currentWorldId = worldId;
    selectedModIds = window.LF.getActiveMods(worldId).map(m => m.id);
    renderModList();
    modalOverlay.classList.add('open');
  };
  
  // Close modal
  document.getElementById('mod-btn-cancel').addEventListener('click', function() {
    modalOverlay.classList.remove('open');
  });
  
  // Apply selected mods
  document.getElementById('mod-btn-apply').addEventListener('click', function() {
    if (currentWorldId) {
      window.LF.setActiveMods(currentWorldId, selectedModIds);
      console.log('[MOD UI] Applied', selectedModIds.length, 'mods to world', currentWorldId);
    }
    modalOverlay.classList.remove('open');
  });
  
  // Sample: Add test mod if not exists
  if (window.LF.getAvailableMods().length === 0) {
    const sampleMod = window.LF.createSampleVoidshardMod();
    window.LF.saveMod(sampleMod, 'voidshard:enhanced');
  }
});
</script>
