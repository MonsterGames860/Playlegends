<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0c10" />
  <meta name="description" content="Legends Core Edition Launcher - Voxel game platform" />
  
  <title>Legends Core Edition Launcher</title>
  <link rel="manifest" href="./ce-manifest.json" />
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" />
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" />
  
  <!-- Firebase SDK - Strict order -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
  
  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Service Worker Registration -->
  <script>
    // Service Worker Kayıt ve Update Mekanizması (sw2.js)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw2.js').then(registration => {
          console.log('✅ Service Worker (sw2) registered');
          
          // Deploy version'ı localStorage'dan al
          const lastDeployVersion = localStorage.getItem('legends-ce-deploy-version');
          let updateChecked = false;
          
          // Güncellemeyi kontrol et (ilk yüklemede)
          registration.update();
          
          // Update tespit edildiğinde
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // Yeni SW bulundu - banner göster (sadece 1 kez)
                if (!updateChecked) {
                  updateChecked = true;
                  showUpdateNotification();
                }
              }
            });
          });
        }).catch(error => {
          console.error('❌ Service Worker registration failed:', error);
        });
      });
      
      // Update bildirimini göster (Sadece yeni deployment varsa)
      let updateShown = false;
      function showUpdateNotification() {
        // Zaten bannerımız varsa çıkış yap
        if (document.getElementById('update-banner')) return;
        if (updateShown) return;
        updateShown = true;
        
        const updateBanner = document.createElement('div');
        updateBanner.id = 'update-banner';
        updateBanner.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          background: linear-gradient(90deg, #9d4edd 0%, #00d9ff 100%);
          color: #fff;
          padding: 12px 20px;
          text-align: center;
          font-weight: 600;
          z-index: 9998;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
          box-shadow: 0 4px 12px rgba(157, 78, 221, 0.3);
          animation: slideDown 0.3s ease-out;
        `;
        updateBanner.innerHTML = `
          <span>🎮 Yeni güncelleme mevcut! Uygulamayı yenile.</span>
          <button id="update-btn" style="
            background: #0b0c10;
            color: #00d9ff;
            border: 1px solid #00d9ff;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
          ">Güncelle</button>
        `;
        
        // Animate girişi
        const style = document.createElement('style');
        style.textContent = `
          @keyframes slideDown {
            from {
              transform: translateY(-100%);
              opacity: 0;
            }
            to {
              transform: translateY(0);
              opacity: 1;
            }
          }
        `;
        document.head.appendChild(style);
        document.body.insertBefore(updateBanner, document.body.firstChild);
        
        // Deploy version'ı güncelle
        const deployTime = new Date().toISOString();
        localStorage.setItem('legends-ce-deploy-version', deployTime);
        console.log('📝 Deploy version saved:', deployTime);
        
        // Güncelle butonu - kullanıcı tıklayana kadar yenileme yapma
        document.getElementById('update-btn').addEventListener('click', () => {
          // Service Worker'a güncelle mesajı gönder
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
              type: 'SKIP_WAITING'
            });
          }
          
          // Sadece butona tıklandığında yenile
          setTimeout(() => {
            window.location.reload();
          }, 500);
        });
      }
      
      // Kontroller değiştiğinde (güncelleme sonrası)
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        console.log('✅ Service Worker updated - new version active');
      });
    }
  </script>
  
  <style>
    /* ============= GLOBAL RESET & VARIABLES ============= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Dark Neon Palette */
      --bg-primary: #0b0c10;
      --bg-secondary: #1a1e2e;
      --bg-tertiary: #16213e;
      
      /* Neon Colors */
      --neon-cyan: #00d9ff;
      --neon-purple: #9d4edd;
      --neon-pink: #ff006e;
      --neon-blue: #3a86ff;
      --neon-green: #06ffa5;
      
      /* Text Colors */
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --text-tertiary: #606060;
      
      /* Borders & Shadows */
      --border-color: #2a2d3a;
      --shadow-sm: 0 2px 8px rgba(0, 217, 255, 0.1);
      --shadow-md: 0 4px 16px rgba(157, 78, 221, 0.2);
      --shadow-lg: 0 8px 32px rgba(255, 0, 110, 0.15);
      
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    /* ============= LAYOUT CONTAINER ============= */
    .launcher-container {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 0;
    }

    /* ============= LEFT SIDEBAR ============= */
    .sidebar {
      width: 280px;
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 24px;
      overflow-y: auto;
    }

    /* Scrollbar Styling */
    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--neon-cyan);
      border-radius: 3px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover {
      background: var(--neon-purple);
    }

    /* --- Profile Card --- */
    .profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(0, 217, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .profile-card:hover {
      background: rgba(0, 217, 255, 0.1);
      border-color: var(--neon-cyan);
      box-shadow: var(--shadow-sm);
    }

    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: var(--bg-primary);
      flex-shrink: 0;
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-status {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .profile-status.guest {
      color: var(--neon-pink);
    }

    .profile-status.player {
      color: var(--neon-green);
    }

    .profile-status.owner {
      color: #FFD700;
    }

    .profile-status.dev {
      color: var(--neon-purple);
    }

    /* --- Game Selection Tabs --- */
    .game-tabs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .game-tab {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(26, 30, 46, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .game-tab:hover {
      background: rgba(58, 134, 255, 0.1);
      border-color: var(--neon-blue);
      color: var(--text-primary);
    }

    .game-tab.active {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.2), rgba(157, 78, 221, 0.2));
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: var(--shadow-sm);
    }

    .game-tab-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      object-fit: contain;
      opacity: 0.8;
      transition: var(--transition);
    }

    /* Eğer emoji ise */
    .game-tab-icon:not(img) {
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-tab.active .game-tab-icon {
      opacity: 1;
      filter: drop-shadow(0 0 8px var(--neon-cyan));
    }

    /* Active state'de resim filter'ı */
    .game-tab.active .game-tab-icon[src] {
      filter: drop-shadow(0 0 8px var(--neon-cyan)) brightness(1.2);
    }

    .game-tab-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Logout Button --- */
    .logout-btn {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 0, 110, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .logout-btn:hover {
      background: rgba(255, 0, 110, 0.15);
      border-color: var(--neon-pink);
      color: var(--neon-pink);
    }

    /* ============= MAIN CONTENT AREA ============= */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Top Header Bar --- */
    .header-bar {
      height: 48px;
      background: linear-gradient(90deg, var(--bg-secondary) 0%, rgba(26, 30, 46, 0.8) 100%);
      border-bottom: 1px solid var(--border-color);

    .header-title {

    }

    .header-spacer {

    .my-versions-btn {

      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .my-versions-btn:hover {

      color: var(--neon-blue);
    }

    .my-versions-btn.active {
      background: rgba(0, 217, 255, 0.1);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    /* ============= CONTENT AREA ============= */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Banner Section --- */
    .banner-section {
      height: 300px;
      background-size: cover;
      background-position: center;
      background-image: url('./final-banner.png'), linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      position: relative;
      overflow: hidden;
    }

    .banner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        180deg,
        rgba(11, 12, 16, 0) 0%,
        rgba(11, 12, 16, 0.3) 50%,
        rgba(11, 12, 16, 0.8) 100%
      );
    }

    .banner-content {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 24px;
    }

    .banner-text {
      flex: 1;
    }

    .banner-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .banner-description {
      font-size: 14px;
      color: var(--text-secondary);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    /* --- Play Bar --- */
    .play-bar {
      padding: 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .play-btn {
      padding: 14px 48px;
      background: linear-gradient(135deg, var(--neon-green) 0%, #00b878 100%);
      border: none;
      border-radius: 6px;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 16px rgba(6, 255, 165, 0.3);
      position: relative;
      overflow: hidden;
    }

    .play-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left 0.5s ease;
    }

    .play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(6, 255, 165, 0.5);
    }

    .play-btn:hover::before {
      left: 100%;
    }

    .play-btn:active {
      transform: translateY(0);
    }

    .version-select {
      padding: 10px 14px;
      background: #000000;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      min-width: 180px;
    }

    .version-select:hover {
      background: #000000;
      border-color: var(--neon-blue);
      color: var(--neon-blue);
    }

    .version-select:focus {
      outline: none;
      background: #000000;
      border-color: var(--neon-blue);
      box-shadow: 0 0 12px rgba(58, 134, 255, 0.3);
      color: var(--neon-blue);
    }

    .version-select option {
      background: #000000;
      color: #ffffff;
    }

    .version-select option:hover {
      background: #1a1a1a;
      color: var(--neon-blue);
    }

    /* --- News/Content Section --- */
    .content-section {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .content-section::-webkit-scrollbar {

    }
    .content-section::-webkit-scrollbar-track {

    }
    .content-section::-webkit-scrollbar-thumb {

      border-radius: 4px;
    }
    .content-section::-webkit-scrollbar-thumb:hover {

    }

    }

      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .edit-news-btn:hover {

      box-shadow: 0 0 12px rgba(157, 78, 221, 0.3);
    }

    }

      border: 1px solid var(--border-color);

    }

      color: var(--text-secondary);
      font-size: 14px;
    }

    /* ============= MODAL STYLES ============= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- Auth Tabs --- */
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .auth-tab {
      flex: 1;
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-transform: uppercase;
    }

    .auth-tab.active {
      color: var(--neon-cyan);
      border-bottom-color: var(--neon-cyan);
    }

    .auth-tab:hover {
      color: var(--text-primary);
    }

    /* --- Forms --- */
    .auth-form-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input,
    .form-select {
      padding: 12px 14px;
      background: rgba(11, 12, 16, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      transition: var(--transition);
    }

    .form-input:focus,
    .form-select:focus {
      outline: none;
      background: rgba(11, 12, 16, 0.7);
      border-color: var(--neon-blue);
      box-shadow: 0 0 12px rgba(58, 134, 255, 0.3);
    }

    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    /* --- Buttons --- */
    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-blue) 100%);
      color: var(--bg-primary);
      box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 217, 255, 0.5);
    }

    .btn-secondary {
      background: rgba(26, 30, 46, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      background: rgba(58, 134, 255, 0.1);
      border-color: var(--neon-blue);
      color: var(--text-primary);
    }

    .btn-guest {
      background: rgba(157, 78, 221, 0.1);
      border: 1px solid var(--neon-purple);
      color: var(--neon-purple);
    }

    .btn-guest:hover {
      background: rgba(157, 78, 221, 0.2);
      color: var(--text-primary);
    }

    /* --- Versions Modal --- */
    .versions-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 24px;
    }

    .versions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 300px;
      overflow-y: auto;
    }

    .version-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(11, 12, 16, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      transition: var(--transition);
    }

    .version-item:hover {
      background: rgba(11, 12, 16, 0.8);
      border-color: var(--neon-cyan);
    }

    .version-item-icon {
      font-size: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
    }

    .version-item-icon img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .version-item-info {
      flex: 1;
    }

    .version-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .version-item-detail {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .version-item-delete {
      padding: 6px 12px;
      background: rgba(255, 0, 110, 0.1);
      border: 1px solid var(--neon-pink);
      border-radius: 4px;
      color: var(--neon-pink);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .version-item-delete:hover {
      background: rgba(255, 0, 110, 0.2);
    }

    .empty-versions-message {
      text-align: center;
      padding: 24px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    /* ===== EASTER EGG ANIMATIONS ===== */
    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-3px) rotate(-1deg); }
      50% { transform: translateX(3px) rotate(1deg); }
      75% { transform: translateX(-2px) rotate(-0.5deg); }
    }

    @keyframes glitch {
      0%, 100% {
        text-shadow: 2px 0 #00d9ff, -2px 0 #ff0000;
      }
      50% {
        text-shadow: -2px 0 #00d9ff, 2px 0 #ff0000;
      }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @keyframes ssss-shake {
      0% { transform: translate(0, 0) scale(1); }
      10% { transform: translate(-2px, -2px) scale(0.98); }
      20% { transform: translate(2px, 2px) scale(1.02); }
      30% { transform: translate(-3px, 1px) scale(0.99); }
      40% { transform: translate(3px, -1px) scale(1.01); }
      50% { transform: translate(1px, -3px) scale(0.98); }
      60% { transform: translate(-1px, 3px) scale(1.02); }
      70% { transform: translate(2px, -2px) scale(1); }
      80% { transform: translate(-2px, 2px) scale(0.99); }
      90% { transform: translate(0, 1px) scale(1.01); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes icon-glitch-shimmer {
      0%, 100% { filter: drop-shadow(0 0 2px #ff0000); }
      25% { filter: drop-shadow(3px -3px 5px #ff0000) drop-shadow(-3px 3px 5px #00d9ff); }
      50% { filter: drop-shadow(-3px -3px 5px #00d9ff) drop-shadow(3px 3px 5px #ff0000); }
      75% { filter: drop-shadow(3px 3px 5px #ff0000) drop-shadow(-3px -3px 5px #ff00ff); }
    }

    @keyframes glitch-flash {
      0% {
        opacity: 1;
        transform: scaleY(1);
      }
      50% {
        opacity: 0.8;
        transform: scaleY(0.98);
      }
      100% {
        opacity: 0;
        transform: scaleY(1);
      }
    }

    /* 12-Renkli Play Button Glitch Efekti */
    @keyframes play-btn-glitch {
      0% {
        text-shadow: 
          -2px 0 #FF0000,
          2px 0 #00FF00,
          0 -2px #0000FF,
          0 2px #FFFF00,
          -3px -3px #FF00FF,
          3px 3px #00FFFF,
          -1px 1px #FF6600,
          1px -1px #00FF99,
          -2px -2px #FF0099,
          2px 2px #00CCFF,
          -3px 0 #FFCC00,
          3px 0 #FF0066;
        filter: brightness(1.2);
      }
      50% {
        text-shadow: 
          2px 0 #0000FF,
          -2px 0 #00FF00,
          -2px 2px #FF0000,
          2px -2px #00FFFF,
          0 -3px #FFFF00,
          0 3px #FF00FF,
          3px 1px #FF6600,
          -3px -1px #00FF99,
          1px 2px #FF0099,
          -1px -2px #00CCFF,
          0 3px #FFCC00,
          0 -3px #FF0066;
        filter: brightness(1.3);
      }
      100% {
        text-shadow: 
          -2px 0 #FF0000,
          2px 0 #00FF00,
          0 -2px #0000FF,
          0 2px #FFFF00,
          -3px -3px #FF00FF,
          3px 3px #00FFFF,
          -1px 1px #FF6600,
          1px -1px #00FF99,
          -2px -2px #FF0099,
          2px 2px #00CCFF,
          -3px 0 #FFCC00,
          3px 0 #FF0066;
        filter: brightness(1.2);
      }
    }

    .play-btn.ssss-glitch {
      animation: play-btn-glitch 0.15s infinite !important;
    }

    .ssss-tab {
      animation: glitch 0.4s infinite;
    }

    .ssss-icon {
      animation: icon-glitch-shimmer 0.3s infinite !important;
      filter: drop-shadow(0 0 3px #ff0000);
    }

    .ssss-label {
      animation: glitch 0.4s infinite;
      color: #ff0000 !important;
      font-weight: bold;
    }
  </style>
</head>

  <!-- Service Worker Registration & Script Tag Opening -->
  <script>
    // ============= SERVICE WORKER & PWA REGISTRATION =============
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./ce-service-worker.js')
        .then(reg => console.log('Service Worker registered:', reg))
        .catch(err => console.warn('Service Worker registration failed:', err));
    }

    // ============= FIREBASE CONFIG (Index'le senkronize) =============
    // Index.html ile aynı Firebase project kullan (play-legends)
    const firebaseConfig = {
      apiKey: "AIzaSyAG6FsNjMgIXIGQmmmHC6GWjWuzNVDq5KM",
      authDomain: "play-legends.firebaseapp.com",
      projectId: "play-legends",
      databaseURL: "https://play-legends-default-rtdb.europe-west1.firebasedatabase.app"
    };

    // Firebase SDK yüklü mü diye kontrol et
    function initializeFirebase() {
      if (typeof firebase === 'undefined' || !firebase.app) {
        console.warn('⚠️ Firebase SDK not loaded. Retrying...');
        setTimeout(initializeFirebase, 500);
        return;
      }

      try {
        // Eğer zaten initialize edilmişse skip et
        if (firebase.apps.length > 0) {
          console.log('✅ Firebase already initialized');
          return;
        }
        firebase.initializeApp(firebaseConfig);
        console.log('✅ Firebase initialized in launcher');
      } catch (err) {
        console.warn('Firebase initialization:', err.message);
      }
    }

    // Sayfan yükleme sırasında başlat
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeFirebase);
    } else {
      initializeFirebase();
    }

    // ============= GOOGLE OAUTH SETUP =============
    window.LegendsOAuth = {
      provider: null,
      
      init: function() {
        if (typeof firebase === 'undefined' || !firebase.auth) return;
        this.provider = new firebase.auth.GoogleAuthProvider();
        this.setupListeners();
      },
      
      setupListeners: function() {
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const googleSignupBtn = document.getElementById('googleSignupBtn');
        
        if (googleLoginBtn) {
          googleLoginBtn.addEventListener('click', () => this.googleLogin());
        }
        if (googleSignupBtn) {
          googleSignupBtn.addEventListener('click', () => this.googleSignup());
        }
      },
      
      googleLogin: async function() {
        try {
          const result = await firebase.auth().signInWithPopup(this.provider);
          const user = result.user;
          
          const userData = {
            uid: user.uid,
            username: user.displayName || user.email.split('@')[0],
            email: user.email,
            type: 'player',
            photoURL: user.photoURL,
            isGuest: false,
            loginMethod: 'google',
            lastLogin: new Date().toISOString()
          };
          
          saveUser(userData);
          updateProfileCard(userData);
          closeAuthModal();
          
          // Sync with game.html
          window.postMessage({
            type: 'legends-user-login',
            data: userData
          }, '*');
          
          console.log('✅ Logged in with Google:', userData.username);
        } catch (error) {
          console.error('Google login error:', error);
          alert('Google login failed: ' + error.message);
        }
      },
      
      googleSignup: async function() {
        try {
          const result = await firebase.auth().signInWithPopup(this.provider);
          const user = result.user;
          
          const userData = {
            uid: user.uid,
            username: user.displayName || user.email.split('@')[0],
            email: user.email,
            type: 'player',
            photoURL: user.photoURL,
            isGuest: false,
            loginMethod: 'google',
            lastLogin: new Date().toISOString()
          };
          
          saveUser(userData);
          updateProfileCard(userData);
          closeAuthModal();
          
          // Sync with game.html
          window.postMessage({
            type: 'legends-user-signup',
            data: userData
          }, '*');
          
          console.log('✅ Signed up with Google:', userData.username);
        } catch (error) {
          console.error('Google signup error:', error);
          alert('Google signup failed: ' + error.message);
        }
      }
    };

    // ============= STATIC FALLBACK VERSIONS =============
    let STATIC_AVAILABLE_VERSIONS = [];

    /**
     * Load versions from versions.json on startup
     */
    async function loadStaticVersions() {
      try {
        const response = await fetch('/versions.json');
        if (response.ok) {
          const data = await response.json();
          STATIC_AVAILABLE_VERSIONS = data.versions || [];
          localStorage.setItem('versionsLastUpdate', data.lastUpdated || new Date().toISOString());
          console.log(`✅ Loaded ${STATIC_AVAILABLE_VERSIONS.length} versions from versions.json`);
        }
      } catch (error) {
        console.warn('Could not load versions.json:', error);
        STATIC_AVAILABLE_VERSIONS = [];
      }
    }

    // Load versions immediately
    loadStaticVersions();

    /**
     * Versiyonu kategoriye ayır (final veya preview)
     */
    function getVersionCategory(type) {
      if (['indev_preview', 'beta_preview', 'alpha_preview', 'preview'].includes(type)) {
        return 'preview';
      }
      return 'final';
    }

    /**
     * Dinamik versiyon etiketi oluştur
     */
    function parseVersionLabel(filename, version, type) {
      // ANA SÜRÜMLER (FINAL KATEGORISI)
      if (type === 'release') {
        return `Version ${version}`;
      }
      if (type === 'indev') {
        return `Version ${version} (Indev)`;
      }
      if (type === 'alpha') {
        return `Version ${version} (Alpha)`;
      }
      if (type === 'beta') {
        return `Version ${version} (Beta)`;
      }

      // PREVIEW SÜRÜMLER (PREVIEW KATEGORISI)
      if (type === 'indev_preview' || /Ip\d/i.test(version)) {
        return `I-Preview ${version}`;
      }
      if (type === 'beta_preview' || /Bp\d/i.test(version)) {
        return `B-Preview ${version}`;
      }
      if (type === 'alpha_preview' || /Ap\d/i.test(version)) {
        return `A-Preview ${version}`;
      }
      if (type === 'preview' || /p\d/i.test(version)) {
        return `Preview ${version}`;
      }

      return `${version}`;
    }

    /**
     * /versions API'sinden versiyon listesini çek
     */
    async function updateVersionDropdown() {
      try {
        console.log('📦 Loading versions from versions.json...');
        populateVersionDropdown(STATIC_AVAILABLE_VERSIONS);
      } catch (error) {
        console.error('Error:', error);
      }
    }

    /**
     * Dropdown'ı kategorilere göre doldur
     */
    function populateVersionDropdown(allVersions = []) {
      const dropdown = document.getElementById('versionSelect');
      
      if (!dropdown) {
        console.error('❌ #versionSelect element bulunamadı');
        return;
      }

      dropdown.innerHTML = '';

      if (!allVersions || allVersions.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = '⚠️ No versions available';
        dropdown.appendChild(option);
        console.warn('⚠️ No versions to display');
        return;
      }

      // Filter ve grup oluştur
      const officialVersions = allVersions.filter(v => v.category === 'final' || v.type === 'release' || v.type === 'indev' || v.type === 'alpha' || v.type === 'beta');
      const previewVersions = allVersions.filter(v => v.category === 'preview' || v.type === 'preview' || v.type === 'indev_preview' || v.type === 'alpha_preview' || v.type === 'beta_preview');

      // Official versions (no group header, just options)
      if (officialVersions.length > 0) {
        officialVersions.forEach(ver => {
          const option = document.createElement('option');
          option.value = ver.filename;
          option.setAttribute('data-type', ver.type || 'release');
          option.setAttribute('data-category', 'final');
          option.textContent = parseVersionLabel(ver.filename, ver.version, ver.type);
          dropdown.appendChild(option);
        });
      }

        switch(error.code) {

    /**
     * Parse version number
     */
    function parseVersion(versionStr) {
      const parts = versionStr.split('.').map(p => parseInt(p) || 0);
      return [parts[0] || 0, parts[1] || 0, parts[2] || 0];
    }

    /**
     * Sort versions
     */
    function compareVersions(versionA, versionB) {
      const [majA, minA, patchA] = parseVersion(versionA);
      const [majB, minB, patchB] = parseVersion(versionB);
      if (majA !== majB) return majB - majA;
      if (minA !== minB) return minB - minA;
      return patchB - patchA;
    }

    /**

     */
    function loadAndDisplayNews() {
      const newsData = localStorage.getItem(STORAGE_KEYS.NEWS);
      const news = newsData ? JSON.parse(newsData) : [];
      const container = document.getElementById('newsContainer');
      
      if (news.length === 0) {
        container.innerHTML = '<div class="no-news-message">No announcements available</div>';
        return;
      }
      
      container.innerHTML = news.map((item, index) => `
        <div class="news-card">
          <div class="news-card-content">
            <div class="news-card-title">${item.title}</div>
            <div class="news-card-date">${item.date}</div>
          </div>
          ${hasEditNewsPermission(getUser()) ? `
            <button type="button" class="news-card-delete-btn" onclick="deleteNews(${index})">Delete</button>
          ` : ''}
        </div>
      `).join('');
    }

    /**
     * Delete news item
     */
    function deleteNews(index) {
      if (!hasEditNewsPermission(getUser())) return;
      
      const newsData = localStorage.getItem(STORAGE_KEYS.NEWS);
      const news = newsData ? JSON.parse(newsData) : [];
      news.splice(index, 1);
      localStorage.setItem(STORAGE_KEYS.NEWS, JSON.stringify(news));
      loadAndDisplayNews();
    }

    /**
     * Add new news item
     */
    function addNews(title, date) {
      if (!hasEditNewsPermission(getUser())) {
        alert('You do not have permission to add announcements.');
        return;
      }
      
      if (!title.trim()) {
        alert('Please enter a title.');
        return;
      }
      
      if (!date.trim()) {
        alert('Please enter a date.');
        return;
      }
      
      const newsData = localStorage.getItem(STORAGE_KEYS.NEWS);
      const news = newsData ? JSON.parse(newsData) : [];
      
      news.unshift({ title, date });
      localStorage.setItem(STORAGE_KEYS.NEWS, JSON.stringify(news));
      
      loadAndDisplayNews();
      document.getElementById('newsTitle').value = '';
      document.getElementById('newsDate').value = '';
      document.getElementById('addNewsForm').classList.remove('active');
    }

     */
    async function checkAutoLogin() {
      try {
        // Wait for Firebase to initialize
        let retries = 0;
        while ((typeof firebase === 'undefined' || !firebase.apps || firebase.apps.length === 0) && retries < 20) {
          await new Promise(resolve => setTimeout(resolve, 100));
          retries++;
        }

        if (typeof firebase === 'undefined' || !firebase.auth) {
          console.warn('Firebase not available for auto-login');
          return;
        }

        const auth = firebase.auth();
        
        // Check if user is currently logged in Firebase
        auth.onAuthStateChanged((firebaseUser) => {
          if (firebaseUser) {
            // User is logged in
            console.log('✅ Auto-login: User found in Firebase');
            
            const user = {
              username: firebaseUser.displayName || "Player",
              email: firebaseUser.email,
              uid: firebaseUser.uid,
              rank: 'Player',
              type: 'firebase',
              loginTime: new Date().toISOString()
            };
            
            saveUser(user);
            updateProfileCard(user);
            closeAuthModal();
          } else {
            // No user logged in Firebase - show login required message
            console.log('⚠️ No auto-login: User not logged in');
            showLoginRequiredModal();
          }
        });

      } catch (error) {
        console.warn('Auto-login check failed:', error);
      }
    }

    /**
     * Initialize launcher on page load
     */
    async function initializeLauncher() {
      try {
        // Wait for Firebase to initialize
        let retries = 0;
        while ((typeof firebase === 'undefined' || !firebase.apps || firebase.apps.length === 0) && retries < 20) {
          await new Promise(resolve => setTimeout(resolve, 100));
          retries++;
        }

        if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
          console.log('✅ Firebase ready');
        } else {
          console.warn('⚠️ Firebase may not be fully loaded');
        }

        checkAutoLogin();
        
        const user = getUser();

        if (user) {
          updateProfileCard(user);
          closeAuthModal();
        }

        // Update versions dropdown from API
        await updateVersionDropdown();

        // Load and display news

        updateNewsEditButton();

        // Set active game tab
        const firstTab = document.querySelector('.game-tab.active');
        if (firstTab) {
          firstTab.click();
        }

        // Check offline status
        if (!navigator.onLine) {
          document.getElementById('myVersionsBtn').disabled = true;
          document.getElementById('myVersionsBtn').style.opacity = '0.5';
        }

        // Load last played version
        const lastPlayed = localStorage.getItem(STORAGE_KEYS.LAST_PLAYED);
        if (lastPlayed) {
          const { file } = JSON.parse(lastPlayed);
          const dropdown = document.getElementById('versionSelect');
          const option = Array.from(dropdown.options).find(opt => opt.value === file);
          if (option) {
            dropdown.value = file;
          }
        }

        console.log('🎮 Legends CE Launcher initialized');
        console.log(`📡 Loaded versions: ${document.getElementById('versionSelect').length - 1} available`);

        // ============= AUTO-UPDATE VERSIONS EVERY 30 SECONDS =============
        startVersionsAutoUpdate();
      } catch (error) {
        console.error('Initialization error:', error);
      }
    }

    /**
     * Auto-update versions from versions.json
     * Checks every 30 seconds for new versions
     */
    function startVersionsAutoUpdate() {
      let lastUpdateTime = localStorage.getItem('versionsLastUpdate') || '0';

      setInterval(async () => {
        try {
          // Cache bust with timestamp
          const response = await fetch('/versions.json?t=' + Date.now());
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          const currentUpdateTime = data.lastUpdated || new Date().toISOString();

          // Check if versions were updated
          if (currentUpdateTime > lastUpdateTime && data.versions && data.versions.length > 0) {
            lastUpdateTime = currentUpdateTime;
            localStorage.setItem('versionsLastUpdate', lastUpdateTime);
            
            console.log(`✅ New versions detected! Updating dropdown...`);
            populateVersionDropdown(data.versions);
          }
        } catch (error) {
          console.warn(`Auto-update check failed: ${error.message}`);
        }
      }, 30000); // Check every 30 seconds
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeLauncher);

    function playGlitchSound() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioContext.currentTime;
      
      // Tiz ses (2000Hz)
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      
      osc.frequency.value = 2000;
      osc.connect(gain);
      gain.connect(audioContext.destination);
      
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      
      osc.start(now);
      osc.stop(now + 0.5);
    }

    // ============= YARDIMCI: TYPE FORMAT DÖNÜŞTÜRME =============
    function formatTypeLabel(typeString) {
      // indev_preview → I-Preview
      if (typeString === 'indev_preview') {
        return 'I-Preview';
      }
      // indev → Indev
      if (typeString === 'indev') {
        return 'Indev';
      }
      // Diğerleri: ilk harfi büyük, underscore boşluk
      return typeString.charAt(0).toUpperCase() + typeString.slice(1).replace(/_/g, ' ');
    }

    // ============= SÜRÜMLERI JSON'DAN YÜKLE =============
    async function loadVersionsFromJSON() {
      try {
        const response = await fetch('./versions.json');
        
        // Dosya bulunamadıysa hata
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Dosya bulunamadı`);
        }
        
        const data = await response.json();
        
        // Veri kontrolü
        if (!data.versions || !Array.isArray(data.versions)) {
          throw new Error('Geçersiz versions.json formatı');
        }
        
        // Sürümleri kategorilere göre ayır
        const finalVersions = data.versions.filter(v => v.category === 'final');
        const previewVersions = data.versions.filter(v => v.category === 'preview');
        
        // Legends (final) sürümleri
        versionData.legends.versions = finalVersions.map(v => ({
          value: v.filename,
          label: `Version ${v.version} (${formatTypeLabel(v.type)})`
        }));
        
        // Legends Preview sürümleri
        versionData['legends-preview'].versions = previewVersions.map(v => ({
          value: v.filename,
          label: `Version ${v.version} (${formatTypeLabel(v.type)})`
        }));
        
        console.log('✅ Versions loaded from JSON:', versionData);
        return true;
      } catch (error) {
        console.error('❌ Error loading versions.json:', error);
        
        // Hata göster
        showVersionLoadError(error.message);
        
        // Fallback: localStorage'dan yükle
        return loadVersionsFromLocalStorage();
      }
    }

    // ============= LOCALSTORAGE'DAN SÜRÜMLERI YÜKLE (FALLBACK) =============
    function loadVersionsFromLocalStorage() {
      try {

          console.warn('⚠️ No versions in localStorage either - using default fallback');
          return loadDefaultFallbackVersions();
        }
        
        const versions = JSON.parse(versionsData);
        
        // Sürümleri kategorilere ayır
        const finalVersions = versions.filter(v => v.category === 'final');
        const previewVersions = versions.filter(v => v.category === 'preview');
        
        versionData.legends.versions = finalVersions.map(v => ({
          value: v.filename,
          label: `Version ${v.version} (${formatTypeLabel(v.type)})`
        }));
        
        versionData['legends-preview'].versions = previewVersions.map(v => ({
          value: v.filename,
          label: `Version ${v.version} (${formatTypeLabel(v.type)})`
        }));
        
        console.log('✅ Versions loaded from localStorage');
        return true;
      } catch (error) {
        console.error('❌ localStorage error:', error);
        return loadDefaultFallbackVersions();
      }
    }

          if (gameKey === 'legends') {
            logoFile = './legends.png';
            logoLabel = 'LEGENDS';
          } else if (gameKey === 'legends-preview') {
            logoFile = './preview.png';
            logoLabel = 'PREVIEW';
          }
          
          // Logo overlay container
          if (logoFile) {
            const logoOverlay = document.createElement('div');
            logoOverlay.style.cssText = `
              position: absolute;
              bottom: 16px;
              left: 16px;
              z-index: 10;
            `;
            
            const logoImg = document.createElement('img');
            logoImg.src = logoFile;
            logoImg.style.cssText = `
              width: 240px;
              height: 80px;
              object-fit: contain;
              filter: drop-shadow(0 0 8px rgba(157, 78, 221, 0.5));
              display: block;
            `;
            logoImg.onerror = () => console.warn(`⚠️ Logo not found: ${logoFile}`);
            logoImg.onload = () => console.log('✅ Logo loaded:', logoFile);
            logoOverlay.appendChild(logoImg);
            bannerSection.appendChild(logoOverlay);
          }
        }
      }

      // SÜRÜM SEÇİMİ GÜNCELLE
      const versionSelect = document.getElementById('versionSelect');
      if (versionSelect) {
        versionSelect.innerHTML = '';
        versionSelect.style.borderColor = '';
        
        if (!data.versions || data.versions.length === 0) {
          const errorOption = document.createElement('option');
          errorOption.value = '';
          errorOption.textContent = '❌ Sürüm yüklenenemedi';
          errorOption.disabled = true;
          errorOption.selected = true;
          versionSelect.appendChild(errorOption);
          versionSelect.style.borderColor = '#ff006e';
          console.warn('⚠️ No versions for:', gameKey);
          return;
        }
        
        data.versions.forEach(ver => {
          const option = document.createElement('option');
          option.value = ver.value;
          option.textContent = ver.label;
          versionSelect.appendChild(option);
        });
        
        if (data.versions.length > 0) {
          versionSelect.value = data.versions[0].value;
          console.log('✅ Versions loaded for', gameKey, ':', data.versions.length);
        }
      }

      // NEWS SECTION GÜNCELLE
      const newsSection = document.querySelector('.news-updates');
      if (newsSection) {
        const title = newsSection.querySelector('h3');
        if (title) {
          title.textContent = data.newsTitle;
          console.log('📰 News title set to:', data.newsTitle);
          
          // SSSS için glitch efekti, diğerleri için normal
          if (gameKey === 'ssss') {
            title.style.cssText = `
              color: #ff0000;
              text-shadow: 0 0 10px #ff0000, 0 0 20px #000;
              animation: glitch 0.3s infinite;
              font-weight: bold;
            `;
          } else {
            title.style.cssText = 'color: #fff; font-weight: 600;';
          }
        }

        // News listesini güncelle
        const newsList = newsSection.querySelector('.news-list');
        if (newsList) {
          newsList.innerHTML = '';
          
          if (data.defaultNews && data.defaultNews.length > 0) {
            data.defaultNews.forEach(item => {
              const newsItem = document.createElement('div');
              newsItem.className = 'news-item';
              newsItem.innerHTML = `
                <div class="news-card" style="padding: 12px; border-left: 3px solid ${gameKey === 'ssss' ? '#ff0000' : '#00d9ff'}; margin-bottom: 8px; background: rgba(0,0,0,0.3); border-radius: 4px;">
                  <div style="font-weight: 600;">${item.title}</div>
                  <div style="font-size: 0.85em; color: #888; margin-top: 4px;">${item.date}</div>
                </div>
              `;
              newsList.appendChild(newsItem);
            });
            console.log('✅ News items loaded for', gameKey);
          }
        }
      }
    }

    // ============= GAME TAB HANDLERS =============
    function setupGameTabHandlers() {
      const gameTabs = document.querySelectorAll('.game-tab');
      gameTabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          // Remove active from all tabs
          gameTabs.forEach((t) => t.classList.remove('active'));
          // Add active to clicked tab
          tab.classList.add('active');

          // Get game key
          const gameKey = tab.getAttribute('data-game');
          
          // Update content
          updateGameContent(gameKey);

          // SSSS için jumble efektini başlat
          if (gameKey === 'ssss') {
            startSSSSNameJumble();
            const playBtn = document.getElementById('playBtn');
            if (playBtn) {
              playBtn.classList.add('ssss-glitch');
            }
          } else {
            stopSSSSNameJumble();
            const playBtn = document.getElementById('playBtn');
            if (playBtn) {
              playBtn.classList.remove('ssss-glitch');
            }
          }
        });
      });
    }

    // Play game function
    function playGame() {
      const dropdown = document.getElementById('versionSelect');
      const selectedFile = dropdown.value;
      
      // Aktif tab'ı bul
      const activeTab = document.querySelector('.game-tab.active');
      const gameKey = activeTab ? activeTab.getAttribute('data-game') : 'legends';

      if (!selectedFile) {
        alert('❌ Lütfen önce bir sürüm seçiniz!');
        return;
      }

      // Easter egg version (SSSS) ayrı PWA'da açılır
      if (gameKey === 'ssss') {
        if (selectedFile === 'gameexe.html') {
          console.log('🔓 Opening SSSS Easter Egg...');
          window.open(selectedFile, 'ssss_game', 'width=1200,height=800');
          return;
        }
      }

      // Normal sürümler iframe'de açılır
      const gameOverlay = document.getElementById('gameOverlay');
      if (!gameOverlay) {
        console.error('❌ Game overlay not found');
        alert('❌ Oyun penceresi açılamadı!');
        return;
      }

      const gameFrame = document.getElementById('gameFrame');
      if (!gameFrame) {
        console.error('❌ Game frame not found');
        alert('❌ Oyun çerçevesi bulunamadı!');
        return;
      }
      
      // Dosyayı hemen yükle (HEAD isteği kaldırıldı - timeout'u kaldırıyor)
      const fileUrl = './' + selectedFile;
      console.log('🎮 Loading game:', fileUrl);
      
      gameFrame.src = fileUrl;
      gameOverlay.style.display = 'flex';
      
      // Error handling - iframe yükleme hatası
      gameFrame.onerror = () => {
        console.error('❌ Failed to load game:', fileUrl);
        alert(`❌ Oyun dosyası yüklenemedi:\n${selectedFile}\n\nLütfen dosyanın var olduğundan emin olun.`);
        gameOverlay.style.display = 'none';
      };
      
      gameFrame.onload = () => {
        console.log('✅ Game loaded successfully:', fileUrl);
      };
    }

    // Make functions global for debugging
    window.handleProfileClick = handleProfileClick;
    window.unlockEasterEgg = unlockEasterEgg;
    window.playGame = playGame;
    window.profileClickCount = () => profileClickCount;

    console.log('🎮 Easter egg system loaded. Type: window.unlockEasterEgg() to unlock');
    document.addEventListener('DOMContentLoaded', async () => {
      const closeBtn = document.querySelector('.close-game-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          const gameOverlay = document.getElementById('gameOverlay');
          if (gameOverlay) gameOverlay.style.display = 'none';
        });
      }
      
      // JSON'dan sürümleri yükle
      await loadVersionsFromJSON();
      
      // Setup game tab handlers
      setupGameTabHandlers();
      
      // Initialize with first game
      const firstTab = document.querySelector('.game-tab');
      if (firstTab) {
        firstTab.click();
      }
    });

  </script>
</body>
</html>
